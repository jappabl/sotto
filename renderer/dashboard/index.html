<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sotto</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-drag"></div>
      <div class="brand">
        <svg class="brand-mark" width="22" height="22" viewBox="0 0 22 22">
          <g fill="currentColor">
            <rect x="1"  y="8"  width="2.6" height="6"  rx="1.3"/>
            <rect x="5.4" y="4" width="2.6" height="14" rx="1.3"/>
            <rect x="9.8" y="7" width="2.6" height="8"  rx="1.3"/>
            <rect x="14.2" y="2" width="2.6" height="18" rx="1.3"/>
            <rect x="18.6" y="9" width="2.6" height="4"  rx="1.3"/>
          </g>
        </svg>
        <span class="brand-name">Sotto</span>
        <span class="brand-badge">Local</span>
      </div>
      <nav id="nav-top"></nav>
      <div class="sidebar-spacer"></div>
      <div id="privacy-card">
        <div class="pc-title">100% on-device <span class="pc-moon">🌙</span></div>
        <div class="pc-sub">Every word is transcribed locally. Nothing ever leaves this Mac.</div>
      </div>
      <nav id="nav-bottom"></nav>
    </aside>
    <main id="canvas">
      <div id="page"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
